<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Runnin-G</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="icons/icon.svg" alt=""><span>Runnin<b>-G</b></span></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="hrBtn" title="Conectar pulsómetro">❤</button>
        <button class="icon-btn" id="settingsBtn" title="Perfil y ajustes">⚙</button>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="today" class="active"><span class="ti">◉</span><span>Hoy</span></button>
      <button data-tab="plan"><span class="ti">▦</span><span>Plan</span></button>
      <button data-tab="run" class="run-tab"><span class="ti">▶</span></button>
      <button data-tab="history"><span class="ti">≡</span><span>Historial</span></button>
      <button data-tab="coach"><span class="ti">✦</span><span>Coach</span></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
