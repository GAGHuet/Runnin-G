<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d7f"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#c6ff3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6ff3d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)" opacity="0.5"/>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.18" stroke-width="14">
    <line x1="58" y1="196" x2="118" y2="196"/>
    <line x1="40" y1="246" x2="104" y2="246"/>
    <line x1="58" y1="296" x2="112" y2="296"/>
  </g>
  <!-- G as a running route -->
  <path d="M372 170 A140 140 0 1 0 396 300 L396 262 L290 262"
        fill="none" stroke="url(#g)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- dashed track inside the route -->
  <path d="M372 170 A140 140 0 1 0 396 300"
        fill="none" stroke="#070a14" stroke-width="6" stroke-dasharray="18 22" stroke-linecap="round" opacity="0.55"/>
  <!-- GPS start pin at the end of the route -->
  <circle cx="290" cy="262" r="30" fill="#070a14"/>
  <circle cx="290" cy="262" r="19" fill="#c6ff3d"/>
  <circle cx="290" cy="262" r="7" fill="#070a14"/>
</svg>
